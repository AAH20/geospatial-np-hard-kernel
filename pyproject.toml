[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-np-hard-kernel"
version = "1.0.0"
description = "Deterministic zero-dependency Python solvers for the 10 Apex NP-Hard Problems in GIS and Geospatial Intelligence."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Autonomous Systems Lab & Geospatial Defense Research"}
]
keywords = [
    "gis",
    "geoint",
    "np-hard",
    "arcgis",
    "qgis",
    "cartography",
    "facility-location",
    "viewshed",
    "districting",
    "dubins-path",
    "line-simplification",
    "evacuation-routing",
    "spatial-weights",
    "colocation-mining",
    "satellite-scheduling"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
geospatial-kernel = "geospatial_np_hard_kernel.cli:main"
